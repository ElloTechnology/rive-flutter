name: rive
version: 0.14.7
homepage: https://rive.app
description: Rive Flutter Runtime. This package provides runtime functionality for Rive graphics built with the Rive editor available at https://rive.app
repository: https://github.com/rive-app/rive-flutter
topics:
  - animation
  - ui
  - effects
  - design
  - games

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.28.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  meta: ^1.9.0
  rive_native: 0.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  rive_native:
    git:
      url: https://github.com/ElloTechnology/rive-native.git
      # branch ello-2026-05-review at pin time. Must include both:
      #   * fb02524 — force Dart_InitializeApiDL in profile/release builds
      #     (without it, the worker's first Dart_PostInteger_DL jumps
      #     through a null fn pointer and SIGSEGVs).
      #   * abbe693 — self-paced bg loop + main-thread-safe scheduleFrame
      #     wrapper (Patch E from the COR-3538 perf investigation).
      ref: bc9e88457c35e4b93fc27f5981155f7161adf0bc
