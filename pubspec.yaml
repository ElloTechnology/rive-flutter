name: rive
version: 0.14.7
homepage: https://rive.app
description: Rive Flutter Runtime. This package provides runtime functionality for Rive graphics built with the Rive editor available at https://rive.app
repository: https://github.com/rive-app/rive-flutter
topics:
  - animation
  - ui
  - effects
  - design
  - games

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.28.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  meta: ^1.9.0
  rive_native: 0.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  rive_native:
    git:
      url: https://github.com/ElloTechnology/rive-native.git
      # branch ello/main at pin time. Tracks the productionized rive_native fork
      # tip the application consumes (forced Dart_InitializeApiDL in
      # profile/release, the COR-3538 push-not-poll worker handshake, and the
      # XP-1123 threaded Fit-frame decouple). Only affects this fork's standalone
      # resolution — the application's own root override is what ships.
      ref: 8f593300ceba1793878b07732c92adc6f0709b50
